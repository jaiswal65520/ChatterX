<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatterX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #121b22;
      color: #e9edef;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    /* Header */
    .header {
      background-color: #1f2c34;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222d34;
    }
    .header h1 {
      font-size: 20px;
      color: #00a884;
    }
    .header-icons {
      display: flex;
      gap: 15px;
      color: #8696a0;
      font-size: 18px;
    }
    /* Search Bar */
    .search-container {
      padding: 10px 15px;
      background-color: #121b22;
    }
    .search-input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      background-color: #202c33;
      color: #e9edef;
      font-size: 14px;
      outline: none;
    }
    /* Chat List */
    .chat-list {
      flex: 1;
      overflow-y: auto;
    }
    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid #222d34;
      cursor: pointer;
    }
    .chat-item:active {
      background-color: #202c33;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #00a884;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      margin-right: 15px;
      color: #ffffff;
    }
    .chat-details {
      flex: 1;
    }
    .chat-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .chat-name {
      font-weight: 600;
      font-size: 16px;
    }
    .chat-time {
      font-size: 12px;
      color: #8696a0;
    }
    .chat-message {
      font-size: 14px;
      color: #8696a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Bottom Nav */
    .bottom-nav {
      background-color: #1f2c34;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid #222d34;
    }
    .nav-item {
      color: #8696a0;
      font-size: 13px;
      text-align: center;
      font-weight: 500;
    }
    .nav-item.active {
      color: #00a884;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>ChatterX</h1>
    <div class="header-icons">
      <span>🔍</span>
      <span>⋮</span>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="search-container">
    <input type="text" class="search-input" placeholder="Search or start new chat...">
  </div>

  <!-- Chat List -->
  <div class="chat-list">
    <div class="chat-item">
      <div class="avatar">AI</div>
      <div class="chat-details">
        <div class="chat-top">
          <span class="chat-name">ChatterX Bot</span>
          <span class="chat-time">17:25</span>
        </div>
        <div class="chat-message">Welcome! Phase 2 Home Screen UI active.</div>
      </div>
    </div>
    <div class="chat-item">
      <div class="avatar" style="background-color: #34b7f1;">JD</div>
      <div class="chat-details">
        <div class="chat-top">
          <span class="chat-name">John Doe</span>
          <span class="chat-time">16:40</span>
        </div>
        <div class="chat-message">Hey, are we still meeting today?</div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-item active">Chats</div>
    <div class="nav-item">Status</div>
    <div class="nav-item">Settings</div>
  </div>

</body>
</html>
