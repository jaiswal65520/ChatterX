<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatterX</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0b141a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .chat-container { width: 100%; max-width: 450px; height: 90vh; background: #111b21; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .chat-header { background: #202c33; padding: 15px; color: #e9edef; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2a3942; }
        .chat-header .title { font-size: 18px; font-weight: bold; }
        .chat-header .status { font-size: 12px; color: #8696a0; }

        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(#202c33 1px, transparent 0); background-size: 10px 10px; }
        
        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .incoming { background: #202c33; color: #e9edef; align-self: flex-start; border-top-left-radius: 0; }
        .outgoing { background: #005c4b; color: #e9edef; align-self: flex-end; border-top-right-radius: 0; }
        
        .input-area { background: #202c33; padding: 10px; display: flex; align-items: center; gap: 8px; }
        .input-area input { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 8px; color: #e9edef; outline: none; font-size: 14px; }
        .input-area button { background: #00a884; border: none; padding: 12px 16px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div>
            <div class="title">ChatterX</div>
            <div class="status">online</div>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message incoming">Welcome to ChatterX!</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Message type karein..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    function sendMessage() {
        let input = document.getElementById("userInput");
        let chatBox = document.getElementById("chatBox");
        
        if (input.value.trim() !== "") {
            let msg = document.createElement("div");
            msg.className = "message outgoing";
            msg.textContent = input.value;
            chatBox.appendChild(msg);
            
            let userText = input.value;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                let autoReply = document.createElement("div");
                autoReply.className = "message incoming";
                autoReply.textContent = "Aapka message mil gaya: '" + userText + "'";
                chatBox.appendChild(autoReply);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
