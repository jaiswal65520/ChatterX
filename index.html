<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatterX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #121b22;
      color: #e9edef;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    /* Views */
    .view {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }
    .view.active {
      display: flex;
    }
    /* Home Screen Styles */
    .header {
      background-color: #1f2c34;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222d34;
    }
    .header h1 {
      font-size: 20px;
      color: #00a884;
    }
    .header-icons {
      display: flex;
      gap: 15px;
      color: #8696a0;
      font-size: 18px;
    }
    .search-container {
      padding: 10px 15px;
      background-color: #121b22;
    }
    .search-input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      background-color: #202c33;
      color: #e9edef;
      font-size: 14px;
      outline: none;
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
    }
    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid #222d34;
      cursor: pointer;
    }
    .chat-item:active {
      background-color: #202c33;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #00a884;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      margin-right: 15px;
      color: #ffffff;
    }
    .chat-details {
      flex: 1;
    }
    .chat-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .chat-name {
      font-weight: 600;
      font-size: 16px;
    }
    .chat-time {
      font-size: 12px;
      color: #8696a0;
    }
    .chat-message {
      font-size: 14px;
      color: #8696a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bottom-nav {
      background-color: #1f2c34;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid #222d34;
    }
    .nav-item {
      color: #8696a0;
      font-size: 13px;
      text-align: center;
      font-weight: 500;
    }
    .nav-item.active {
      color: #00a884;
      font-weight: bold;
    }

    /* Chat Screen Styles */
    .chat-header {
      background-color: #1f2c34;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #222d34;
    }
    .back-btn {
      background: none;
      border: none;
      color: #8696a0;
      font-size: 22px;
      cursor: pointer;
    }
    .chat-header-info .title {
      font-size: 16px;
      font-weight: bold;
      color: #e9edef;
    }
    .chat-header-info .status {
      font-size: 12px;
      color: #8696a0;
    }
    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #0b141a;
    }
    .message {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .incoming {
      background-color: #202c33;
      color: #e9edef;
      align-self: flex-start;
      border-top-left-radius: 0;
    }
    .outgoing {
      background-color: #005c4b;
      color: #e9edef;
      align-self: flex-end;
      border-top-right-radius: 0;
    }
    .input-area {
      background-color: #202c33;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      background: #2a3942;
      border: none;
      padding: 12px;
      border-radius: 8px;
      color: #e9edef;
      font-size: 14px;
      outline: none;
    }
    .input-area button {
      background: #00a884;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Home Screen View -->
  <div id="homeView" class="view active">
    <div class="header">
      <h1>ChatterX</h1>
      <div class="header-icons">
        <span>🔍</span>
        <span>⋮</span>
      </div>
    </div>
    <div class="search-container">
      <input type="text" class="search-input" placeholder="Search or start new chat...">
    </div>
    <div class="chat-list">
      <div class="chat-item" onclick="openChat()">
        <div class="avatar">AI</div>
        <div class="chat-details">
          <div class="chat-top">
            <span class="chat-name">ChatterX Bot</span>
            <span class="chat-time">17:25</span>
          </div>
          <div class="chat-message">Welcome! Tap here to start chatting.</div>
        </div>
      </div>
      <div class="chat-item">
        <div class="avatar" style="background-color: #34b7f1;">JD</div>
        <div class="chat-details">
          <div class="chat-top">
            <span class="chat-name">John Doe</span>
            <span class="chat-time">16:40</span>
          </div>
          <div class="chat-message">Hey, are we still meeting today?</div>
        </div>
      </div>
    </div>
    <div class="bottom-nav">
      <div class="nav-item active">Chats</div>
      <div class="nav-item">Status</div>
      <div class="nav-item">Settings</div>
    </div>
  </div>

  <!-- Chat Screen View -->
  <div id="chatView" class="view">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()">←</button>
      <div class="avatar" style="width: 36px; height: 36px; font-size: 14px; margin: 0;">AI</div>
      <div class="chat-header-info">
        <div class="title">ChatterX Bot</div>
        <div class="status">online</div>
      </div>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="message incoming">Welcome to ChatterX! Tap any chat from home to open.</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Message type karein..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    function openChat() {
      document.getElementById('homeView').classList.remove('active');
      document.getElementById('chatView').classList.add('active');
    }

    function closeChat() {
      document.getElementById('chatView').classList.remove('active');
      document.getElementById('homeView').classList.add('active');
    }

    function sendMessage() {
      let input = document.getElementById("userInput");
      let chatBox = document.getElementById("chatBox");

      if (input.value.trim() !== "") {
        let msg = document.createElement("div");
        msg.className = "message outgoing";
        msg.textContent = input.value;
        chatBox.appendChild(msg);

        let userText = input.value;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        setTimeout(() => {
          let autoReply = document.createElement("div");
          autoReply.className = "message incoming";
          autoReply.textContent = "Aapka message mil gaya: " + userText;
          chatBox.appendChild(autoReply);
          chatBox.scrollTop = chatBox.scrollHeight;
        }, 1000);
      }
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  </script>

</body>
</html>
